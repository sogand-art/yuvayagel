<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #0f172a; }
      .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 2; rx: 24; filter: url(#shadow); }
      .title { font: 700 28px Inter, sans-serif; fill: #f8fafc; }
      .text { font: 500 16px Inter, sans-serif; fill: #0f172a; }
      .label { font: 600 14px Inter, sans-serif; fill: #64748b; }
      .icon { font-size: 24px; }
      .arrow { fill: none; stroke: #94a3b8; stroke-width: 4; marker-end: url(#arrowhead); }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 18; }
      .small { font: 600 14px Inter, sans-serif; fill: #0f172a; }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1000" height="580" rx="32" class="bg" />
  <text x="50" y="55" class="title">Proje Mimarisi</text>
  <text x="50" y="85" class="label">Yuvaya Gel - Next.js + Firebase</text>

  <g transform="translate(50,120)">
    <rect x="0" y="0" width="250" height="140" class="card" />
    <text x="30" y="40" class="text">Kullanıcı</text>
    <text x="30" y="70" class="icon">🧑‍💻</text>
    <text x="30" y="100" class="small">Tarayıcı / Mobil</text>
  </g>

  <g transform="translate(350,90)">
    <rect x="0" y="0" width="300" height="220" class="card" />
    <text x="30" y="40" class="text">Next.js Uygulaması</text>
    <text x="30" y="80" class="small">app/(public) + app/(admin)</text>
    <rect x="30" y="110" width="240" height="44" class="box" />
    <text x="45" y="138" class="small">Kamu Arayüzü</text>
    <rect x="30" y="170" width="240" height="44" class="box" />
    <text x="45" y="198" class="small">Admin Paneli</text>
  </g>

  <g transform="translate(320,335)">
    <line x1="120" y1="0" x2="120" y2="50" class="arrow" />
  </g>

  <g transform="translate(240,200)">
    <line x1="250" y1="70" x2="350" y2="70" class="arrow" />
  </g>

  <g transform="translate(50,360)">
    <rect x="0" y="0" width="880" height="180" class="card" />
    <text x="30" y="36" class="text">Firebase Hizmetleri</text>
    <g transform="translate(30,60)">
      <rect x="0" y="0" width="200" height="100" class="box" />
      <text x="18" y="28" class="small">🔑 Authentication</text>
      <text x="18" y="52" class="small">Kullanıcı Girişi</text>
    </g>
    <g transform="translate(250,60)">
      <rect x="0" y="0" width="200" height="100" class="box" />
      <text x="18" y="28" class="small">📄 Firestore Veritabanı</text>
      <text x="18" y="52" class="small">Evcil Hayvanlar, Mesajlar</text>
    </g>
    <g transform="translate(480,60)">
      <rect x="0" y="0" width="200" height="100" class="box" />
      <text x="18" y="28" class="small">🖼 Storage</text>
      <text x="18" y="52" class="small">Fotoğraf Depolama</text>
    </g>
    <g transform="translate(710,60)">
      <rect x="0" y="0" width="130" height="100" class="box" />
      <text x="18" y="28" class="small">🌐 Hosting</text>
      <text x="18" y="52" class="small">Uygulama Sunumu</text>
    </g>
  </g>

  <line x1="260" y1="190" x2="320" y2="150" class="arrow" />
  <line x1="260" y1="250" x2="320" y2="190" class="arrow" />
  <line x1="250" y1="450" x2="250" y2="420" class="arrow" />
  <line x1="620" y1="450" x2="620" y2="420" class="arrow" />

  <rect x="340" y="480" width="320" height="70" rx="18" fill="#94a3b8" opacity="0.15" />
  <text x="390" y="516" class="text">Veri Akışı</text>
  <text x="390" y="545" class="small">Kullanıcı → Next.js → Firebase</text>
</svg>
